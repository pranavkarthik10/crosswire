name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test src/
      # native runner per target: the iroh napi module must match the platform
      - run: bun build --compile --outfile=crosswire src/cli.ts
      - run: tar -czf crosswire-${{ matrix.target }}.tar.gz crosswire
      - uses: actions/upload-artifact@v4
        with:
          name: crosswire-${{ matrix.target }}
          path: crosswire-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: crosswire-*.tar.gz
          generate_release_notes: true

  # Publishes crosswire + 4 platform packages (binary embeds Bun; users need
  # neither Bun nor Node beyond npm itself). Skipped until the NPM_TOKEN
  # repository secret (npm automation token) is set.
  npm:
    needs: build
    runs-on: ubuntu-24.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: binaries
      - name: prepare packages
        run: bun scripts/prepare-npm.ts "${GITHUB_REF_NAME#v}" binaries
      - name: publish
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for p in crosswire-darwin-arm64 crosswire-darwin-x64 crosswire-linux-x64 crosswire-linux-arm64 crosswire; do
            (cd dist-npm/$p && npm publish --access public)
          done
